[project]
name = "exapt"
version = "0.1.0"
description = "Biomedical graph learning for drug repurposing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub==2.2.0",
    "torch>=2.14,<2.15",
]

[project.scripts]
exapt = "exapt:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
failOnWarnings = false
